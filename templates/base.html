<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}币安量化回测策略系统{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
<nav class="topbar">
    <div class="topbar-inner">
        <a class="topbar-brand" href="/"><span class="dot">●</span> 币安量化系统</a>
        <div class="topbar-nav">
            <a href="/" class="{{ 'active' if active_page == 'index' }}">回测系统</a>
            <a href="/demo" class="{{ 'active' if active_page == 'demo' }}">模拟现货</a>
            <a href="/auto" class="{{ 'active' if active_page == 'auto' }}">自动现货</a>
            <a href="/futures" class="{{ 'active' if active_page == 'futures' }}">自动合约</a>
            <a href="/composite" class="{{ 'active' if active_page == 'composite' }}">综合量化</a>
            <a href="/strategies" class="{{ 'active' if active_page == 'strategies' }}">最优策略</a>
            <a href="/settings" class="{{ 'active' if active_page == 'settings' }}">设置</a>
        </div>
        <div class="topbar-user">
            <span class="ver">{{ APP_VERSION }}</span>
            {% if session.get('user') %}
            <span title="当前登录账号">👤 {{ session['user'] }}</span>
            <a href="/logout" style="color:#f6465d" title="退出登录">退出</a>
            {% endif %}
        </div>
    </div>
</nav>
{% block body %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
